<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            background-image: url(https://images.pexels.com/photos/707837/pexels-photo-707837.jpeg);
            background-size: cover;
            background-position: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        .dice {
            width: 150px;
            height: 150px;
            margin: 20px auto 35px;
            background: white;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 20px;
            gap: 8px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
        }

        .dot {
            width: 22px;
            height: 22px;
            background: #222;
            border-radius: 50%;
            justify-self: center;
            align-self: center;
        }

        .rolling {
            animation: roll 0.7s ease;
        }

        @keyframes roll {
            0% {
                transform: rotate(0deg) scale(1);
            }

            25% {
                transform: rotate(90deg) scale(1.1);
            }

            50% {
                transform: rotate(180deg) scale(0.9);
            }

            75% {
                transform: rotate(270deg) scale(1.1);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        button {
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            background: #00c6ff;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #0072ff;
        }

        button:active {
            transform: scale(0.95);
        }

        #result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎲 Dice Roller</h1>

        <div class="dice" id="dice"></div>

        <button onclick="rollDice()">ROLL DICE</button>

        <div id="result">Click the button to roll!</div>

    </div>

    <script>

        const dice = document.getElementById("dice");
        const result = document.getElementById("result");

        const positions = {
            1: [5],
            2: [1, 9],
            3: [1, 5, 9],
            4: [1, 3, 7, 9],
            5: [1, 3, 5, 7, 9],
            6: [1, 3, 4, 6, 7, 9]
        };

        function showDice(number) {

            dice.innerHTML = "";

            for (let i = 1; i <= 9; i++) {

                const dot = document.createElement("div");

                if (positions[number].includes(i)) {
                    dot.classList.add("dot");
                }

                dice.appendChild(dot);
            }
        }

        function rollDice() {

            dice.classList.remove("rolling");

            // Restart animation
            void dice.offsetWidth;

            dice.classList.add("rolling");

            result.textContent = "Rolling... 🎲";

            setTimeout(() => {

                const randomNumber = Math.floor(Math.random() * 6) + 1;

                showDice(randomNumber);

                result.textContent = `You rolled: ${randomNumber} 🎉`;

            }, 700);
        }

        // Display dice face 1 initially
        showDice(1);

    </script>

</body>
</html>
